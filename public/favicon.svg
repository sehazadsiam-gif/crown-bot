<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Glowing Circular Speech Bubble Ring -->
  <path d="M 32 8 C 45.25 8 56 18.75 56 32 C 56 37.8 53.9 43.1 50.4 47.2 L 53 56 L 43.8 53.2 C 40.2 55 36.2 56 32 56 C 18.75 56 8 45.25 8 32 C 8 18.75 18.75 8 32 8 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Chatbot Inner Helmet / Head -->
  <rect x="18" y="19" width="28" height="25" rx="8" fill="url(#faceGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Visor / Face Screen -->
  <rect x="21" y="24" width="22" height="15" rx="5" fill="#090d16"/>

  <!-- Glowing Robot Eyes -->
  <circle cx="27" cy="31" r="3" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="37" cy="31" r="3" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Eye Center Pupil Highlights -->
  <circle cx="27" cy="31" r="1.2" fill="#ffffff"/>
  <circle cx="37" cy="31" r="1.2" fill="#ffffff"/>

  <!-- Friendly Smile Waveform -->
  <path d="M 28 35.5 Q 32 38 36 35.5" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Antenna Light -->
  <circle cx="32" cy="15" r="1.8" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
