<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Red squircle background -->
  <rect width="64" height="64" rx="14" fill="#CC0000"/>

  <!-- Chat bubble -->
  <ellipse cx="32" cy="11" rx="9" ry="7" fill="#FFFFFF"/>
  <polygon points="27,17 32,22 34,17" fill="#FFFFFF"/>

  <!-- CC text -->
  <text x="32" y="42"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="20"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-1">CC</text>

  <!-- Chatbot label -->
  <text x="32" y="58"
    font-family="Arial, sans-serif"
    font-weight="700"
