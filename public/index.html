  <script>
    const API = window.location.pathname.startsWith('/chatbotadmin') ? '/chatbotadmin' : '';
    const api = (p, opts = {}) => {
      const token = localStorage.getItem('cc_token');
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        ...(opts.headers || {})
      };
      const path = p.startsWith('/') ? p : '/' + p;
      const url = API ? (API + path) : path;
      return fetch(url, { credentials: 'same-origin', ...opts, headers });
    };

    let S = null, saveT = null, selConv = null;
    let currentWorkspaceId = 1, workspaces = [];
    let currentUser = null, allMasterTenants = [];
    let pendingNewWsId = null;

    function chip(t) {
      const e = document.getElementById('saveChip');
      if (!e) return;
      e.textContent = t;
      clearTimeout(chip._t);
      chip._t = setTimeout(() => e.textContent = '', 2200);
    }
    function showSaveChip(t) {
      chip(t);
    }
    window.chip = chip;
    window.showSaveChip = showSaveChip;

    /* ---------- AUTHENTICATION & ROLE ENGINE ---------- */
    async function checkAuth() {
      const r = await api('/api/me').then(r => r.json()).catch(() => ({ authed: false }));
      if (r.authed) {
        currentUser = r;
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';

        // Populate Donezo Executive Header Profile Chip
        const userName = r.username || (r.role === 'master_admin' ? 'Master Admin' : (r.workspace_name || 'Admin'));
        const userEmail = r.email || (r.role === 'master_admin' ? 'admin@ccadmin.online' : 'operations@ccadmin.online');
        const userInitial = (userName || 'A').slice(0, 2).toUpperCase();
        const hName = document.getElementById('headerUserName');
        if (hName) hName.textContent = userName;
        const hEmail = document.getElementById('headerUserEmail');
        if (hEmail) hEmail.textContent = userEmail;
        const hAvatar = document.getElementById('headerUserAvatar');
        if (hAvatar) hAvatar.textContent = userInitial;

        startDonezoTimer();

        const masterControls = document.getElementById('masterWsControls');
        const masterNav = document.getElementById('navMasterSection');
        const tenantControls = document.getElementById('tenantControls');
        const tenantExpiredBanner = document.getElementById('tenantExpiredBanner');

        if (r.role === 'master_admin') {
          if (masterControls) masterControls.style.display = 'flex';
          if (masterNav) masterNav.style.display = 'block';
          if (tenantControls) tenantControls.style.display = 'none';
          if (tenantExpiredBanner) tenantExpiredBanner.style.display = 'none';

          const masterBadge = document.getElementById('masterAdminBadge');
          if (masterBadge) masterBadge.style.display = 'inline-flex';
          const btnHeaderUpgrade = document.getElementById('btnHeaderUpgrade');
          if (btnHeaderUpgrade) btnHeaderUpgrade.style.display = 'none';

          document.getElementById('brandTitleTxt').textContent = 'CC Chatbot';
          document.getElementById('brandSubTxt').textContent = 'Master Control Hub';
          document.title = 'CC Chatbot — Master Admin';
          document.getElementById('brandLogoBadge').textContent = '👑';

          switchTab('tenants');
          await loadMasterTenants();
          await loadWorkspaces();
        } else {
          // Tenant Admin
          currentWorkspaceId = r.workspace_id;
          if (masterControls) masterControls.style.display = 'none';
          if (masterNav) masterNav.style.display = 'none';
          if (tenantControls) tenantControls.style.display = 'flex';

          const masterBadge = document.getElementById('masterAdminBadge');
          if (masterBadge) masterBadge.style.display = 'none';
          const inspectingBanner = document.getElementById('masterInspectingBanner');
          if (inspectingBanner) inspectingBanner.style.display = 'none';
          const btnHeaderUpgrade = document.getElementById('btnHeaderUpgrade');
          if (btnHeaderUpgrade) btnHeaderUpgrade.style.display = 'inline-flex';

          const bizName = r.workspace_id === 1 ? 'CC' : (r.workspace_name || 'My Business');
          document.getElementById('brandTitleTxt').textContent = bizName + ' Chatbot';
          document.getElementById('brandSubTxt').textContent = 'AI Operations Center';
          document.title = `${bizName} — CC Chatbot AI Operations`;
          document.getElementById('brandLogoBadge').textContent = r.workspace_id === 1 ? 'CC' : (bizName.slice(0, 2).toUpperCase());

          // Render Subscription Status Badge
          const sub = r.subscription;
          const subBadge = document.getElementById('tenantSubBadge');
          if (subBadge && sub) {
            if (sub.status === 'trial') {
              subBadge.className = 'sub-badge ' + (sub.isExpired ? 'expired' : 'trial');
              subBadge.textContent = sub.isExpired ? 'Trial Expired' : `14-Day Free Trial (${sub.daysRemaining}d left)`;
            } else if (sub.status === 'active') {
              subBadge.className = 'sub-badge active';
              subBadge.textContent = `Active Package (${sub.daysRemaining}d)`;
            } else if (sub.status === 'suspended') {
              subBadge.className = 'sub-badge suspended';
              subBadge.textContent = 'Service Suspended';
            } else {
              subBadge.className = 'sub-badge expired';
              subBadge.textContent = 'Subscription Inactive';
            }
          }

          if (tenantExpiredBanner) {
            tenantExpiredBanner.style.display = (r.workspace_id !== 1 && (sub?.isExpired || sub?.status === 'suspended')) ? 'block' : 'none';
          }

          // Mandatory First-Time Password Setup (Never for Workspace 1)
          if (r.must_change_password && r.workspace_id !== 1) {
            document.getElementById('flEmailIn').value = r.email || '';
            document.getElementById('firstLoginModal').classList.add('open');
          } else {
            document.getElementById('firstLoginModal').classList.remove('open');
            // First login helper: provide clear social channel setup guidelines
            const seenGuideKey = `seen_social_guide_${r.workspace_id}`;
            if (r.workspace_id !== 1 && r.role !== 'master_admin' && !localStorage.getItem(seenGuideKey)) {
              setTimeout(() => {
                openSocialGuideModal('fb');
                localStorage.setItem(seenGuideKey, '1');
              }, 1000);
            }
          }

          switchTab('dash');
          await load(currentWorkspaceId);
          await loadOrders();
        }
      } else {
        document.getElementById('login').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
      }
    }

      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showSaveChip('Copied to clipboard');

        prompt('Copy value:', text);

          body: JSON.stringify({

            force: true
          })

      allOrdersList = res.orders || [];

      const elConf = document.getElementById('ordKpiConfirmed');
      const elRej = document.getElementById('ordKpiRejected');
      const badge = document.getElementById('pendingOrdersBadge');

      if (elTot) elTot.textContent = stats.total || 0;
      if (elPend) elPend.textContent = stats.pending || 0;
      if (elConf) elConf.textContent = stats.confirmed || 0;
      if (elRej) elRej.textContent = stats.rejected || 0;

      if (badge) {
        const pendingCount = stats.pending || 0;
        badge.textContent = pendingCount;
        badge.style.display = pendingCount > 0 ? 'inline-block' : 'none';

        </td>
        <td>

        </td>

      allMasterTenants = res.tenants || [];
      renderMasterTenantsTable(allMasterTenants);

      // Compute Master KPIs
      const total = allMasterTenants.length;
      const activeSubs = allMasterTenants.filter(t => t.subscription?.status === 'active' && !t.subscription?.isExpired).length;
      const trials = allMasterTenants.filter(t => t.subscription?.status === 'trial' && !t.subscription?.isExpired).length;
      const totalRev = allMasterTenants.reduce((acc, t) => acc + (t.subscription?.monthly_fee || 0), 0);

      document.getElementById('mstTotalTenants').textContent = total;
      document.getElementById('mstActiveSubs').textContent = activeSubs;
      document.getElementById('mstTrials').textContent = trials;
      document.getElementById('mstTotalRevenue').textContent = `BDT ${totalRev.toLocaleString()}`;
    }

    /* Master Actions */
    async function activatePackagePrompt(wsId, wsName) {
      const daysStr = prompt(`Activate paid package for "${wsName}". Enter duration in days (+30, +90, +365):`, '30');
      if (!daysStr) return;
      const days = Number(daysStr);
      if (isNaN(days) || days <= 0) return alert('Invalid number of days.');

      const targetDate = new Date(Date.now() + days * 86400 * 1000).toISOString();
      const res = await api(`/api/admin/tenants/${wsId}/subscription`, {
        method: 'PUT',
        body: JSON.stringify({
          status: 'active',
          plan_name: `Standard ${days}-Day Active Package`,
          active_until: targetDate
        })
      });
      if (res.ok) {
        chip(`Package activated for +${days} days`);
        await loadMasterTenants();
      } else {
        alert('Failed to activate package.');
      }
    }

    async function extendTrialPrompt(wsId, wsName) {
      const daysStr = prompt(`Extend 14-day free trial for "${wsName}". Enter extra days (+7, +14):`, '7');
      if (!daysStr) return;
      const days = Number(daysStr);
      if (isNaN(days) || days <= 0) return alert('Invalid number of days.');

      const targetDate = new Date(Date.now() + days * 86400 * 1000).toISOString();
      const res = await api(`/api/admin/tenants/${wsId}/subscription`, {
        method: 'PUT',
        body: JSON.stringify({
          status: 'trial',
          plan_name: `Extended 14-Day Trial`,
          trial_ends_at: targetDate
        })

    async function emailCredentialsPrompt(wsId, wsName, currentEmail) {
      const recipient = prompt(`Dispatch credentials and dedicated domain for "${wsName}".\nEnter recipient email address:`, currentEmail || '');

      chip('Sending credentials email…');

        const res = await api(`/api/admin/tenants/${wsId}/send-credentials`, {
          method: 'POST',
          body: JSON.stringify({ email: recipient.trim() })

          alert(`✅ Credentials and dedicated portal dispatched to: ${recipient.trim()}\n\nDedicated Domain: ${d.details?.domain || 'Auto-routed'}\nAdmin User: ${d.details?.email || recipient.trim()}`);

    /* ---------- WORKSPACE SWITCHING ---------- */
    async function loadWorkspaces() {
      const res = await api('/api/workspaces').then(r => r.json()).catch(() => ({ workspaces: [] }));
      workspaces = res.workspaces || [];

      const sel = document.getElementById('activeWorkspaceSelect');
      if (sel) {
        sel.innerHTML = workspaces.map(w => `
      <option value="${w.id}" ${w.id === currentWorkspaceId ? 'selected' : ''}>${esc(w.name)} (#${w.id})</option>
    `).join('');
      }
    }

    async function switchWorkspace(wsId) {
      currentWorkspaceId = Number(wsId);
      const sel = document.getElementById('activeWorkspaceSelect');
      if (sel) sel.value = String(currentWorkspaceId);
      await load(currentWorkspaceId);
      if (document.querySelector('nav button[data-p="inbox"].active')) loadInbox();

      const activeWs = workspaces.find(w => w.id === currentWorkspaceId);
      const name = activeWs?.name || (currentWorkspaceId === 1 ? 'CC' : `Workspace #${currentWorkspaceId}`);
      const nameEl = document.getElementById('inspectingWsNameTxt');
      const idEl = document.getElementById('inspectingWsIdTxt');
      if (nameEl) nameEl.textContent = name;
      if (idEl) idEl.textContent = currentWorkspaceId;

      chip(`Active Client: ${name}`);
    }

    document.getElementById('activeWorkspaceSelect').onchange = e => switchWorkspace(+e.target.value);

    /* ---------- LOAD & AUTO-SAVE ENGINE ---------- */
    async function load(wsId = null) {
      if (wsId) currentWorkspaceId = Number(wsId);
      await loadWorkspaces();
      const d = await api(`/api/config?workspace_id=${currentWorkspaceId}`).then(r => r.json());
      S = d.config;

      if (currentUser?.role !== 'master_admin') {
        const bizName = (currentWorkspaceId === 1 ? 'CC' : (S?.business?.name || S?.cafe?.name || 'My Business'));
        const badge = bizName.split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'CC';
        const logoBadge = document.getElementById('brandLogoBadge');
        const titleTxt = document.getElementById('brandTitleTxt');
        if (logoBadge) logoBadge.textContent = badge;
        if (titleTxt) titleTxt.textContent = bizName;
      }

      render();
      paintPrompt(d.prompt);
      paintOpen(d.open);
      paintStats(d.stats);
      loadOrders();

      const curWs = workspaces.find(w => w.id === currentWorkspaceId);
      const domText = document.getElementById('dashDomainStatusText');
      if (domText && curWs) {
        domText.textContent = curWs.custom_domain ? (curWs.custom_domain.includes('.') ? curWs.custom_domain : `${curWs.custom_domain}.ccadmin.online`) : 'Auto-routed & SSL Secured';
      }
    }

    function chip(t) {
      const e = document.getElementById('saveChip');
      if (!e) return;
      e.textContent = t;
      clearTimeout(chip._t);
      chip._t = setTimeout(() => { if (e) e.textContent = ''; }, 2200);
    }

    function save() {
      clearTimeout(saveT);
      saveT = setTimeout(async () => {
        const r = await api(`/api/config?workspace_id=${currentWorkspaceId}`, {
          method: 'PUT',
          body: JSON.stringify({ config: S, workspace_id: currentWorkspaceId })
        });
        if (r.ok) {
          const d = await r.json();
          paintPrompt(d.prompt);
          paintOpen(d.open);
          if (d.stats) paintStats(d.stats);
          chip('Active & Synced');
        } else {
          chip('Save failed');
        }
      }, 500);
    }

    function toggleMobileNav() {

      const backdrop = document.getElementById('navBackdrop');
      if (!nav) return;
      const isOpen = nav.classList.toggle('open');
      if (backdrop) backdrop.classList.toggle('active', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }
    window.toggleMobileNav = toggleMobileNav;

    function closeMobileNav() {
      const nav = document.getElementById('nav');
      const backdrop = document.getElementById('navBackdrop');
      if (nav) nav.classList.remove('open');
      if (backdrop) backdrop.classList.remove('active');
      document.body.style.overflow = '';
    }

    function mobileExitThread() {
      const inboxEl = document.querySelector('.inbox');
      if (inboxEl) inboxEl.classList.remove('chat-view-active');
      selConv = null;
      document.querySelectorAll('#convList .conv').forEach(c => c.classList.remove('sel'));
    }
    window.mobileExitThread = mobileExitThread;

    function switchTab(tabId) {
      if (!tabId) return;
      closeMobileNav();
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.p === tabId));
      document.querySelectorAll('.mobile-bottom-btn').forEach(x => x.classList.toggle('active', x.dataset.bottomP === tabId));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.p === tabId));

      // Avg Response Time
      const rt = document.getElementById('stAvgResponse');
      if (rt) {

        rt.textContent = ms < 1000 ? (ms ? `${ms}ms` : 'N/A') : `${(ms / 1000).toFixed(1)}s`;
      }

      const totalOut = (s.aiReplies || 0) + (s.humanReplies || 0);
      const isZero = totalOut === 0;
      const rate = !isZero ? Math.round(((s.aiReplies || 0) / totalOut) * 1000) / 10 : 100;
      const resRateTxt = document.getElementById('resRateTxt');
      const resRateSub = document.getElementById('resRateSub');

      if (resRateTxt) resRateTxt.textContent = isZero ? '100%' : `${rate}%`;

      if (resRateCaption) {

          : `${s.aiReplies || 0} autonomous replies out of ${totalOut} messages resolved.`;
      }

      // Update Donezo Semicircular Radial Gauge Arc
      const gaugeRate = isZero ? 100 : Math.min(99.9, Math.max(5, rate));
      const angle = Math.PI * (1 - (gaugeRate / 100));
      const gx = (100 - 75 * Math.cos(angle)).toFixed(1);
      const gy = (100 - 75 * Math.sin(angle)).toFixed(1);
      const gaugeEl = document.getElementById('donezoGaugeFill');
      if (gaugeEl) gaugeEl.setAttribute('d', `M 25 100 A 75 75 0 0 1 ${gx} ${gy}`);

      // Update 7-Day Capsule Bar Chart Heights

        if (maxDay > 0) {
          fills.forEach((f, idx) => {
            if (daySums[idx] !== undefined && daySums[idx] > 0) {
              const h = Math.max(20, Math.round((daySums[idx] / maxDay) * 88));
              f.style.height = `${h}%`;

    function renderHeatmap(heatmap) {
      const el = document.getElementById('heatmapRows');
      if (!el || !heatmap) return;
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      let maxVal = 1;
      for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) maxVal = Math.max(maxVal, heatmap[d]?.[String(h).padStart(2, '0')] || 0);

      el.innerHTML = days.map((day, d) => {
        const cells = Array.from({ length: 24 }, (_, h) => {
          const key = String(h).padStart(2, '0');
          const val = heatmap[d]?.[key] || 0;
          const intensity = val / maxVal;
          const alpha = intensity < 0.01 ? 0 : Math.max(0.12, Math.min(0.95, intensity));
          const bg = val === 0 ? 'var(--surface2)' : `rgba(59,130,246,${alpha.toFixed(2)})`;
          return `<div title="${day} ${h}:00 - ${val} messages" style="height:18px;border-radius:2px;background:${bg};cursor:default"></div>`;
        }).join('');
        return `<div style="display:grid;grid-template-columns:36px repeat(24,1fr);gap:2px;margin-bottom:2px">
      <div style="font-size:10px;color:var(--ink3);line-height:18px">${day}</div>
      ${cells}
    </div>`;
      }).join('');
    }

    /* ---------- CHANNEL TESTING & CLIPBOARD ---------- */
    async function testChannel(platform) {
      const el = document.getElementById(platform === 'facebook' ? 'fbTestResult' : platform === 'instagram' ? 'igTestResult' : platform === 'whatsapp' ? 'waTestResult' : 'ttTestResult');
      if (el) el.textContent = 'Testing connection ping…';

      try {
        const res = await api('/api/channels/test', {
          method: 'POST',
          body: JSON.stringify({ platform, config: S.channels?.[platform] })
        });
        const data = await res.json();
        if (data.ok) {
          let extraMsg = '';
          if (platform === 'facebook' && data.id) {
            const pageIdInput = document.querySelector('[data-b="channels.facebook.pageId"]');
            const curEnteredId = String(S.channels?.facebook?.pageId || '').trim();
            if (curEnteredId !== String(data.id).trim()) {
              if (!S.channels) S.channels = {};
              if (!S.channels.facebook) S.channels.facebook = {};
              S.channels.facebook.pageId = String(data.id).trim();
              if (pageIdInput) pageIdInput.value = String(data.id).trim();
              save();
              extraMsg = `<div style="margin-top:6px; font-size:12px; color:var(--accent); font-weight:700">⚡ Page ID auto-corrected to "${data.id}" and saved!</div>`;
            }
          }

          if (el) el.innerHTML = `<span style="color:var(--good);font-weight:700">${data.info || 'Connected'}</span>${extraMsg}`;
          else alert(`${platform.toUpperCase()}: ${data.info || 'Connected'}`);
        } else {
          if (el) el.innerHTML = `<span style="color:var(--danger);font-weight:700">${data.error || 'Connection failed'}</span>`;
          else alert(`${platform.toUpperCase()}: ${data.error || 'Connection failed'}`);
        }
      } catch (e) {
        if (el) el.innerHTML = `<span style="color:var(--danger);font-weight:700">Error: ${e.message}</span>`;
      }
    }

    function relativeTime(isoOrMs) {
      try {
        const diff = Date.now() - new Date(isoOrMs).getTime();
        if (isNaN(diff)) return '';
        if (diff < 60000) return 'just now';
        if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
        if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
        return Math.floor(diff / 86400000) + 'd ago';
      } catch { return ''; }
    }

    /* ---------- PUSH NOTIFICATIONS ---------- */
    async function enablePushNotifications() {
      const notifBtn = document.getElementById('notifBtn');
      const origText = notifBtn ? notifBtn.textContent : '';
      if (notifBtn) notifBtn.textContent = 'Requesting…';

      if (!('Notification' in window)) {
        alert('Browser notifications are not supported in this browser.');
        if (notifBtn) notifBtn.textContent = origText || '🔔 Enable Notifications';
        return;
      }

      try {
        let perm = Notification.permission;
        if (perm !== 'granted') {
          perm = await Notification.requestPermission();
        }

        if (perm !== 'granted') {
          alert('Notification permission: ' + perm + '. If you are using Incognito mode or your browser blocks notifications, please check your browser address bar permissions.');
          if (notifBtn) notifBtn.textContent = '🔔 Enable Notifications';
          return;
        }

        // Permission granted!
        showSaveChip('✓ Notification permission granted');
        if (notifBtn) {
          notifBtn.textContent = '✓ Notifications Active';
          notifBtn.classList.add('on');
        }

        // Attempt background service worker push registration
        if ('serviceWorker' in navigator && 'PushManager' in window) {
          const swPath = window.location.pathname.startsWith('/chatbotadmin') ? '/chatbotadmin/sw.js' : '/sw.js';
          try {
            let reg = await navigator.serviceWorker.getRegistration();
            if (!reg) {
              reg = await navigator.serviceWorker.register(swPath);
            }
            const keyRes = await api('/api/push/vapid-public-key').then(r => r.json()).catch(() => ({ key: '' }));
            if (keyRes.key) {
              const applicationServerKey = urlBase64ToUint8Array(keyRes.key);
              let sub = await reg.pushManager.getSubscription();
              if (!sub) {
                sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey });
              }
              await api('/api/push/subscribe', { method: 'POST', body: JSON.stringify(sub) });
            }
          } catch (swErr) {
            console.warn('Background service worker push registration warning:', swErr);
          }
        }

        // Trigger confirmation notification
        try {
          new Notification('CC AI Operations Center', {
            body: 'Real-time order and customer alerts are now active.',
            icon: '/favicon.svg'
          });
        } catch (e) { }

      } catch (e) {
        alert('Could not enable notifications: ' + e.message);
        if (notifBtn) notifBtn.textContent = '🔔 Enable Notifications';
      }
    }
    window.enablePushNotifications = enablePushNotifications;

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return new Uint8Array([...rawData].map(c => c.charCodeAt(0)));
    }

          log.innerHTML = '<div class="empty">No messages in this conversation yet.</div>';
        } else {
          d.messages.forEach(m => bubble(m.direction === 'in' ? 'b' : 'u', m.text, 'threadLog'));
        }
        if (d.conversation?.flagged) bubble('sys', '⚑ ' + (d.conversation.flag_reason || 'Flagged thread'), 'threadLog');

        log.scrollTop = log.scrollHeight;

        threadIn.disabled = false;
        threadSend.disabled = false;
        cb.disabled = false;
        cb.checked = !!d.conversation?.bot_enabled;
        const platName = d.conversation?.platform || 'Unknown';
        const platIcon = platName === 'facebook' ? '📘' : platName === 'instagram' ? '📷' : platName === 'whatsapp' ? '📱' : '💬';
        badge.textContent = `${platIcon} ${platName.charAt(0).toUpperCase() + platName.slice(1)}`;
        updateHandoverUi(d.conversation);
      } catch (err) {
        log.innerHTML = `<div class="empty" style="color:var(--danger)">Failed to load conversation. Please try again.</div>`;
        selConv = null;
        updateHandoverUi(null);
      }

      // Refresh the list to show updated selection state
      loadInbox();

    /* ---------- HUMAN HANDOVER CONTROLS ---------- */
    function updateHandoverUi(conv) {
      const dot = document.getElementById('handoverDot');
      const txt = document.getElementById('handoverStatusTxt');
      const btnPause = document.getElementById('btnPauseBot');
      const btnResume = document.getElementById('btnResumeBot');
      if (!txt) return;

      if (!conv) {
        if (btnPause) { btnPause.style.display = 'inline-flex'; btnPause.disabled = true; }
        if (btnResume) btnResume.style.display = 'none';
        if (dot) dot.className = 'handover-dot';
        txt.textContent = '🤖 Select a customer thread to manage AI Handover';
        return;
      }

      const isPaused = conv.ai_paused_until && (new Date(conv.ai_paused_until).getTime() > Date.now());

      if (!conv.bot_enabled) {
        if (btnPause) { btnPause.style.display = 'inline-flex'; btnPause.disabled = true; }
        if (btnResume) btnResume.style.display = 'none';
        if (dot) dot.className = 'handover-dot paused';
        txt.textContent = '⏸ AI Bot is switched off for this customer';
      } else if (isPaused) {
        const diffMs = new Date(conv.ai_paused_until).getTime() - Date.now();
        const mins = Math.max(1, Math.round(diffMs / 60000));
        if (btnPause) btnPause.style.display = 'none';
        if (btnResume) btnResume.style.display = 'inline-flex';
        if (dot) dot.className = 'handover-dot paused';
        txt.textContent = `⏸ Human Handover Active (AI paused for ~${mins}m)`;
      } else {
        if (btnPause) { btnPause.style.display = 'inline-flex'; btnPause.disabled = false; }
        if (btnResume) btnResume.style.display = 'none';
        if (dot) dot.className = 'handover-dot';
        txt.textContent = '🤖 AI Autonomous Bot Active (Replies immediately)';
      }
    }

    async function submitUpgradeRequest(e) {
      if (e) e.preventDefault();
      const phoneInput = document.getElementById('upgradeSenderPhone');
      const trxInput = document.getElementById('upgradeTrxId');
      const msg = document.getElementById('upgradeStatusMsg');
      const btn = document.getElementById('btnSubmitUpgrade');

      const senderPhone = phoneInput?.value.trim();
      const trxId = trxInput?.value.trim().toUpperCase();

      if (!senderPhone || !trxId) {
        alert('Please enter both your sender mobile number and transaction ID (TrxID).');
        return;
      }

      if (btn) { btn.disabled = true; btn.textContent = 'Verifying…'; }
      if (msg) {
        msg.style.display = 'block';
        msg.style.color = 'var(--ink2)';
        msg.textContent = 'Submitting subscription verification request…';
      }

      try {
        const params = currentWorkspaceId ? `?workspace_id=${currentWorkspaceId}` : '';
        const res = await api(`/api/tenant/subscription/request-upgrade${params}`, {
          method: 'POST',
          body: JSON.stringify({
            plan: _selectedPlan,
            payment_method: _selectedMethod,
            trx_id: trxId,
            sender_phone: senderPhone,
            amount: _selectedAmount
          })
        }).then(r => r.json());

        if (res.ok) {
          if (msg) {
            msg.style.color = '#10B981';
            msg.innerHTML = `✅ <strong>Upgrade Request Submitted!</strong> Your TrxID <code>${trxId}</code> is received. Our team will verify and activate your <strong>${_selectedPlan.toUpperCase()}</strong> subscription within 15 minutes.`;
          }
          if (phoneInput) phoneInput.value = '';
          if (trxInput) trxInput.value = '';
          setTimeout(() => {
            closeUpgradeModal();
            chip(`Upgrade to ${_selectedPlan.toUpperCase()} requested successfully!`);
          }, 3500);
        } else {
          if (msg) {
            msg.style.color = 'var(--red)';
            msg.textContent = res.error || 'Failed to submit upgrade request. Please try again.';
          }
        }
      } catch (err) {
        console.error(err);
        if (msg) {
          msg.style.color = 'var(--red)';
          msg.textContent = 'Network error. Please try again.';
        }
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Confirm Upgrade'; }
      }
    }

      simAppendBubble('user', text);

  (function () {

    const cvs = document.getElementById('showcaseCanvas');

      const cx = cvs.getContext('2d');
      let cW, cH, pts = [];
      const N = 55, CONN = 90;

      function resizeCvs() {
        const box = document.getElementById('loginShowcase');
        if (!box) return;
        cW = cvs.width  = box.offsetWidth;
        cH = cvs.height = box.offsetHeight;
      }

      function mkPt() {
        return {
          x: Math.random() * cW, y: Math.random() * cH,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 1.8 + 0.5
        };
      }

      function drawMesh() {
        if (!cW) return;
        cx.clearRect(0, 0, cW, cH);
        pts.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = cW; if (p.x > cW) p.x = 0;
          if (p.y < 0) p.y = cH; if (p.y > cH) p.y = 0;
          cx.beginPath();
          cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          cx.fillStyle = 'rgba(148,163,184,0.55)';
          cx.fill();
        });
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < CONN) {
              cx.beginPath();
              cx.moveTo(pts[i].x, pts[i].y);
              cx.lineTo(pts[j].x, pts[j].y);
              cx.strokeStyle = `rgba(99,102,241,${(1 - d/CONN) * 0.22})`;
              cx.lineWidth = 0.8;
              cx.stroke();
            }
          }
        }
        requestAnimationFrame(drawMesh);
      }

      resizeCvs();
      pts = Array.from({ length: N }, mkPt);
      drawMesh();
      window.addEventListener('resize', () => { resizeCvs(); pts = Array.from({ length: N }, mkPt); });

  <script>
    (function () {
      const canvas = document.getElementById('login-star-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let W, H, stars = [], shooters = [];

      /* ── helpers ── */
      const rand = (min, max) => Math.random() * (max - min) + min;
      const randI = (min, max) => Math.floor(rand(min, max));

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      /* ── star factory ── */
      function mkStar() {
        return {
          x: rand(0, W),
          y: rand(0, H),
          r: rand(0.3, 1.8),
          alpha: rand(0.2, 1),
          dAlpha: rand(0.003, 0.012) * (Math.random() < 0.5 ? 1 : -1),
          color: ['#ffffff', '#c8d8ff', '#ffddb0', '#d0e8ff', '#ffe8f0'][randI(0, 5)]
        };
      }

      /* ── shooting-star factory ── */
      function mkShooter() {
        const angle = rand(Math.PI * 0.1, Math.PI * 0.45);
        return {
          x: rand(W * 0.1, W * 0.9),
          y: rand(H * 0.05, H * 0.45),
          vx: Math.cos(angle) * rand(7, 14),
          vy: Math.sin(angle) * rand(4, 9),
          len: rand(80, 200),
          alpha: 1,
          dAlpha: rand(0.018, 0.032)
        };
      }

      /* ── init ── */
      function init() {
        resize();
        stars = Array.from({ length: 260 }, mkStar);
        shooters = [];
      }

      /* ── draw ── */
      function draw() {
        ctx.clearRect(0, 0, W, H);

        /* stars */
        stars.forEach(s => {
          s.alpha += s.dAlpha;
          if (s.alpha > 1) { s.alpha = 1; s.dAlpha *= -1; }
          if (s.alpha < 0.1) { s.alpha = 0.1; s.dAlpha *= -1; }

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.globalAlpha = s.alpha;
          ctx.fill();
        });

        /* shooting stars */
        shooters.forEach((s, i) => {
          const ex = s.x - Math.cos(Math.atan2(s.vy, s.vx)) * s.len;
          const ey = s.y - Math.sin(Math.atan2(s.vy, s.vx)) * s.len;

          const grad = ctx.createLinearGradient(ex, ey, s.x, s.y);
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(1, `rgba(255,255,255,${s.alpha})`);

          ctx.beginPath();
          ctx.moveTo(ex, ey);
          ctx.lineTo(s.x, s.y);
          ctx.strokeStyle = grad;
          ctx.globalAlpha = s.alpha;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          s.x += s.vx;
          s.y += s.vy;
          s.alpha -= s.dAlpha;
          if (s.alpha <= 0) shooters.splice(i, 1);
        });

        ctx.globalAlpha = 1;

        /* spawn new shooting star occasionally */
        if (Math.random() < 0.004 && shooters.length < 4) {
          shooters.push(mkShooter());
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', () => { resize(); });
      init();
      draw();
    })();
  </script>
</body>
